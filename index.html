<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipig</title>
    <meta
      name="description"
      content="Tipig — a quiet gallery of imperfect, romanticized travel memories. Hiligaynon: to preserve, keep, and guard well."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the latin woff2 used above the fold on "/" — Italiana (display:
         TIPIG + card titles) and IBM Plex Sans/Mono (nav + dates) — so they
         download in parallel with the stylesheet instead of waiting for it.
         These are Google's current versioned files; refresh if a family's
         version bumps. Cormorant is a fallback / About-only, so it's not here. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://fonts.gstatic.com/s/italiana/v21/QldNNTtLsx4E__B0XQmWaXx0xKVu.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSD6llDB6g4tIOm6_De.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q131nj-o.woff2" />
    <!-- Load the font CSS without blocking render: fetch it as a preloaded
         style, then promote it to a stylesheet once it arrives. The fonts use
         display=swap, so text paints immediately in the fallback and swaps in. -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&family=Italiana&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&family=Italiana&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
